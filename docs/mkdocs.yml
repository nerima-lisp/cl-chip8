site_name: cl-chip8
site_description: A CHIP-8 (1977 COSMAC VIP instruction set) interpreter for the terminal.
site_url: https://nerima-lisp.github.io/cl-chip8/
repo_url: https://github.com/nerima-lisp/cl-chip8
repo_name: nerima-lisp/cl-chip8
edit_uri: edit/main/docs/src/

docs_dir: src
site_dir: ../site
use_directory_urls: true
copyright: MIT License
strict: true

theme:
  name: material
  language: en
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Dark mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Core Concepts: guide/core-concepts.md
      - Terminal: guide/terminal.md
  - Reference:
      - API: reference/api.md
      - Architecture: reference/architecture.md
      - Compatibility: reference/compatibility.md
      - Conditions: reference/conditions.md
  - Project:
      - Development: project/development.md
