name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. Without this gate the two drift
      # silently.
      #
      # EVERY :version form must agree with the tag, not just the first one.
      # cl-chip8.asd declares one for the `cl-chip8` system and another for
      # `cl-chip8/test`; the earlier `head -n1` extraction checked only the
      # former, so bumping one and forgetting the other passed this gate while
      # leaving the two systems on different versions.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-chip8
        run: |
          set -euo pipefail
          asd_versions="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd")"
          tag_version="${GITHUB_REF_NAME#v}"
          version_count="$(printf '%s\n' "$asd_versions" | grep -c . || true)"
          distinct_count="$(printf '%s\n' "$asd_versions" | sort -u | grep -c . || true)"
          echo "asd=$(printf '%s' "$asd_versions" | tr '\n' ' ')tag=$tag_version"

          # An extraction that matched nothing would otherwise satisfy every
          # comparison below and pass this gate vacuously.
          if [[ "$version_count" -eq 0 ]]; then
            echo "::error::No :version form found in $PACKAGE.asd" >&2
            exit 1
          fi

          if [[ "$distinct_count" -ne 1 ]]; then
            echo "::error::$PACKAGE.asd declares $version_count :version forms that disagree with each other" >&2
            exit 1
          fi

          # Safe to take the first only now that all of them are proven identical.
          if [[ "$(printf '%s\n' "$asd_versions" | head -n1)" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      # Creates the release as an empty draft. This workflow does not produce a
      # release body at all; the GitHub Release description is the only
      # canonical changelog in this org (see RELEASE_STANDARD.md). After this
      # job goes green the maintainer fills the body in and publishes:
      #
      #   gh release edit "$GITHUB_REF_NAME" --notes-file <file> --draft=false
      #
      # `draft: true` is load-bearing: publishing straight away would make "the
      # maintainer forgot the notes" a user-visible state.
      #
      # Every `uses:` in this org references a 40-character SHA, never a mutable
      # tag. Re-resolve before bumping, and do not copy a SHA you have not
      # resolved yourself:
      #   gh api repos/softprops/action-gh-release/git/ref/tags/v2 --jq .object.sha
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
