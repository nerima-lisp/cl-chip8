name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. The main system's ASDF form is
      # the single version source; the test system intentionally has no version.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-chip8
        run: |
          set -euo pipefail
          asd_versions="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "asd=$(printf '%s' "$asd_versions" | tr '\n' ' ')tag=$tag_version"

          version_count="$(printf '%s\n' "$asd_versions" | grep -c . || true)"
          if [[ "$version_count" -ne 1 ]]; then
            echo "::error::$PACKAGE.asd must declare exactly one :version form" >&2
            exit 1
          fi

          if [[ "$(printf '%s\n' "$asd_versions" | head -n1)" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      - name: Extract changelog entry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          awk -v tag="$version" '
            index($0, "## [" tag "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          draft: false
