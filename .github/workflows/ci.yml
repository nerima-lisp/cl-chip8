name: CI

on:
  push:
    branches: [main, 'verify/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung SBCL test would otherwise hold a runner for the full 6-hour
    # default. `nix flake check` finishes in about 4 minutes from a cold cache.
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      # `nix flake check` runs the SBCL test suite *and* the treefmt
      # formatting gate (checks.formatting), so unformatted Nix fails CI here.
      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Check realtime benchmark compilation
        run: |
          nix develop --command sbcl --noinform --no-userinit --no-sysinit --non-interactive \
            --eval '(require :asdf)' \
            --eval '(load "tools/bootstrap.lisp")' \
            --eval '(let* ((root (truename "./"))
                           (output (merge-pathnames
                                    "cl-chip8-realtime-bench-check.fasl"
                                    (uiop:temporary-directory))))
                      (configure-local-source-registry root)
                      (asdf:load-asd (merge-pathnames "cl-chip8.asd" root))
                      ;; Load project and benchmark dependencies before entering the warning gate.
                      (asdf:load-system "cl-chip8" :force t)
                      (require :sb-sprof)
                      (unwind-protect
                           (run-with-compilation-warning-gate
                            root
                            (lambda ()
                              (multiple-value-bind (fasl warnings-p failure-p)
                                  (compile-file
                                   (merge-pathnames "bench/realtime.lisp" root)
                                   :output-file output)
                                (declare (ignore warnings-p))
                                (unless fasl
                                  (error "Realtime benchmark compilation produced no FASL."))
                                (when failure-p
                                  (error "Realtime benchmark compilation failed."))
                                (format t "Realtime benchmark compilation passed without warnings.~%"))))
                        (when (probe-file output)
                          (delete-file output))))'

      # Keep the measured runtime-coverage baseline as a separate, visible
      # gate.  The coverage script also checks its executable-span classifier
      # and preserves the expression/branch floors documented in tools/coverage.lisp.
      - name: Check coverage
        run: |
          timendus_dir="$(nix build .#timendus --no-link --print-out-paths)"
          CHIP8_TIMENDUS_DIR="$timendus_dir/bin" \
            timeout 900 nix develop --command sbcl --script tools/coverage.lisp

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check

  # Realtime, realtime-ab, and realtime-profile are non-blocking measurements.
  realtime:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/verify/')) || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [advance, render, tty, recording]
    steps:
      - name: Initialize realtime benchmark log
        shell: bash
        run: touch "$RUNNER_TEMP/realtime-${{ matrix.mode }}-${GITHUB_SHA}.log"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Run realtime benchmark
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        env:
          CL_CHIP8_BENCH_MODE: ${{ matrix.mode }}
          CL_CHIP8_BENCH_LOCK_MODE: timing
          CL_CHIP8_BENCH_SECONDS: "10"
          CL_CHIP8_BENCH_RUNS: "3"
          CL_CHIP8_BENCH_WARMUP: "1"
          CL_CHIP8_BENCH_REPORT_ONLY: "1"
        run: |
          log_file="$RUNNER_TEMP/realtime-${{ matrix.mode }}-${GITHUB_SHA}.log"
          script -q "$log_file" /bin/bash -c 'stty cols 130 rows 34; exec nix develop --command sbcl --script bench/realtime.lisp'

      - name: Upload realtime benchmark log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realtime-${{ matrix.mode }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/realtime-${{ matrix.mode }}-${{ github.sha }}.log
          if-no-files-found: error

  realtime-ab:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/verify/')) || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Initialize lock-hook measurement logs
        shell: bash
        run: touch "$RUNNER_TEMP/realtime-count-${GITHUB_SHA}.log"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Count display/audio lock acquisitions
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        env:
          CL_CHIP8_BENCH_MODE: advance
          CL_CHIP8_BENCH_LOCK_MODE: count
          CL_CHIP8_BENCH_SECONDS: "10"
          CL_CHIP8_BENCH_RUNS: "2"
          CL_CHIP8_BENCH_WARMUP: "1"
          CL_CHIP8_BENCH_REPORT_ONLY: "1"
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/realtime-count-${GITHUB_SHA}.log"
          nix develop --command sbcl --script bench/realtime.lisp 2>&1 | tee "$log_file"

      - name: Compare timing hook off and on in ABBA order
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        env:
          CL_CHIP8_BENCH_MODE: recording
          CL_CHIP8_BENCH_SECONDS: "10"
          CL_CHIP8_BENCH_RUNS: "2"
          CL_CHIP8_BENCH_WARMUP: "1"
          CL_CHIP8_BENCH_REPORT_ONLY: "1"
        run: |
          set -euo pipefail
          for index in 1 2 3 4; do
            case "$index" in
              1|4) hook_mode=off ;;
              2|3) hook_mode=timing ;;
            esac
            log_file="$RUNNER_TEMP/realtime-ab-${hook_mode}-${GITHUB_SHA}-${index}.log"
            touch "$log_file"
            CL_CHIP8_BENCH_LOCK_MODE="$hook_mode" \
              script -q "$log_file" /bin/bash -c 'stty cols 130 rows 34; exec nix develop --command sbcl --script bench/realtime.lisp'
          done

      - name: Upload lock-hook measurement logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realtime-ab-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/realtime-count-${{ github.sha }}.log
            ${{ runner.temp }}/realtime-ab-*.log
          if-no-files-found: error

  realtime-profile:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/verify/')) || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Initialize realtime profile log
        shell: bash
        run: touch "$RUNNER_TEMP/realtime-profile-${GITHUB_SHA}.log"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ github.event_name == 'push' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Profile one advance trial with sb-sprof
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        env:
          CL_CHIP8_BENCH_MODE: advance
          CL_CHIP8_BENCH_LOCK_MODE: off
          CL_CHIP8_BENCH_SECONDS: "10"
          CL_CHIP8_BENCH_RUNS: "1"
          CL_CHIP8_BENCH_WARMUP: "0"
          CL_CHIP8_BENCH_REPORT_ONLY: "1"
          CL_CHIP8_BENCH_PROFILE: cpu
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/realtime-profile-${GITHUB_SHA}.log"
          nix develop --command sbcl --script bench/realtime.lisp 2>&1 | tee "$log_file"

      - name: Upload realtime CPU profile
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: realtime-profile-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/realtime-profile-${{ github.sha }}.log
          if-no-files-found: error
